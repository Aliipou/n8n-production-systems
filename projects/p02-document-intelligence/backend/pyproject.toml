[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "p02-doc-service"
version = "0.1.0"
description = "P02 document intelligence: upload, sha256 dedupe, deterministic validators"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.141.1",
  "pydantic==2.13.4",
  "uvicorn==0.35.0",
  "psycopg[binary]==3.3.4",
  "PyYAML==6.0.3",
  "python-multipart==0.0.32",
  "httpx==0.28.1",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "httpx==0.28.1",
  "ruff==0.16.7",
  "mypy==2.3.1",
  "types-PyYAML==6.0.12.20260906",
]

[tool.hatch.build.targets.wheel]
packages = ["src/p02_doc_service"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["p02_doc_service"]
