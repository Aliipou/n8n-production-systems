# Hook revisions looked up 2026-09-11 from GitHub releases.
# gitleaks: v8.30.0 (v8.30.1 is an orphan tag; see TODO(verify) in docs/QUESTIONS.md)
# ruff-pre-commit: v0.16.7
# pre-commit-hooks: v6.0.0

default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: '\.md$'
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
        args: ["--maxkb=5120"]
      - id: detect-private-key

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.7
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format

  - repo: local
    hooks:
      - id: gofmt
        name: gofmt
        entry: gofmt -w -s
        language: system
        files: '\.go$'
        pass_filenames: true
      - id: sanitize-workflows
        name: sanitize n8n workflows
        entry: python scripts/sanitize_workflows.py
        language: python
        files: '(^|/)(platform/workflows|projects/.+/workflows)/.+\.json$'
        pass_filenames: true
      - id: lint-workflows
        name: lint n8n workflows
        entry: python scripts/lint_workflows.py
        language: python
        files: '(^|/)(platform/workflows|projects/.+/workflows)/.+\.json$'
        pass_filenames: true
