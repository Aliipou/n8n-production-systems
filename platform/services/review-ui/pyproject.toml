[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "review-ui"
version = "0.1.0"
description = "Human review queue UI for ops.review_queue"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.141.1",
  "httpx==0.28.1",
  "jinja2==3.1.6",
  "psycopg[binary]==3.3.5",
  "pydantic-settings==2.15.0",
  "python-multipart==0.0.32",
  "uvicorn==0.52.1",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
]

[project.scripts]
review-ui = "review_ui.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["review_ui"]
mypy_path = "src"
