<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Review queue{% endblock %}</title>
  <style>
    body { font-family: Georgia, serif; margin: 1.5rem auto; max-width: 52rem; line-height: 1.45; color: #111; }
    header { margin-bottom: 1.25rem; }
    h1, h2 { font-family: system-ui, sans-serif; font-weight: 600; }
    table { border-collapse: collapse; width: 100%; margin: 0.75rem 0; }
    th, td { border: 1px solid #bbb; padding: 0.4rem 0.55rem; text-align: left; vertical-align: top; }
    th { background: #f4f4f4; }
    .error { color: #7a1515; }
    .notice { background: #f4f4f4; padding: 0.6rem 0.75rem; margin: 0.75rem 0; }
    pre { background: #f7f7f7; padding: 0.75rem; overflow: auto; font-size: 0.9rem; }
    form { margin: 0.75rem 0; }
    label { display: block; margin-bottom: 0.25rem; }
    textarea { width: 100%; min-height: 4rem; }
    button { padding: 0.35rem 0.8rem; margin-right: 0.4rem; }
    .actions { margin-top: 1rem; }
  </style>
</head>
<body>
  <header>
    <p><a href="/reviews">Pending reviews</a></p>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
