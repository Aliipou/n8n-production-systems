# Base stack. Run from the repo root:
#   docker compose --project-directory . -f platform/compose/docker-compose.base.yml --env-file .env up
# Pins: platform/VERSIONS.md. n8n env: platform/compose/n8n.env.md
# Host ports bind to 127.0.0.1 only. Community Edition only.

name: n8n-platform

x-n8n-environment: &n8n-environment
  DB_TYPE: postgresdb
  DB_POSTGRESDB_HOST: postgres
  DB_POSTGRESDB_PORT: "5432"
  DB_POSTGRESDB_DATABASE: ${POSTGRES_DB_N8N}
  DB_POSTGRESDB_USER: ${POSTGRES_USER}
  DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
  EXECUTIONS_MODE: queue
  QUEUE_BULL_REDIS_HOST: redis
  QUEUE_BULL_REDIS_PORT: "6379"
  QUEUE_BULL_REDIS_PASSWORD: ${REDIS_PASSWORD}
  N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
  OFFLOAD_MANUAL_EXECUTIONS_TO_WORKERS: "true"
  N8N_METRICS: "true"
  N8N_METRICS_INCLUDE_QUEUE_METRICS: "true"
  QUEUE_HEALTH_CHECK_ACTIVE: "true"
  WEBHOOK_URL: http://localhost:5678/
  N8N_WEBHOOK_URL: http://localhost:5678/
  GENERIC_TIMEZONE: Europe/Helsinki
  TZ: Europe/Helsinki
  N8N_DIAGNOSTICS_ENABLED: "false"
  N8N_DEFAULT_BINARY_DATA_MODE: database
  EXECUTIONS_DATA_PRUNE: "true"
  EXECUTIONS_DATA_MAX_AGE: "336"
  EXECUTIONS_DATA_SAVE_ON_ERROR: all
  N8N_HOST: localhost
  N8N_PORT: "5678"
  N8N_PROTOCOL: http
  N8N_EDITOR_BASE_URL: http://localhost:5678/
  N8N_SECURE_COOKIE: "false"
  N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
  N8N_RUNNERS_ENABLED: "true"
  N8N_BLOCK_ENV_ACCESS_IN_NODE: "true"

x-n8n-depends: &n8n-depends
  postgres:
    condition: service_healthy
  redis:
    condition: service_healthy
  migrate:
    condition: service_completed_successfully

x-n8n-healthcheck: &n8n-healthcheck
  test:
    [
      "CMD-SHELL",
      "wget -qO- http://127.0.0.1:5678/healthz >/dev/null 2>&1 || exit 1",
    ]
  interval: 10s
  timeout: 5s
  retries: 12
  start_period: 60s

services:
  postgres:
    image: postgres:16.15-alpine
    container_name: n8n-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB_N8N}
      TZ: Europe/Helsinki
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./platform/compose/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7.4.11-alpine
    container_name: n8n-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
      TZ: Europe/Helsinki
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  migrate:
    image: amacneil/dbmate:2.35.1
    container_name: n8n-migrate
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB_APP}?sslmode=disable
      DBMATE_MIGRATIONS_DIR: /migrations
      DBMATE_NO_DUMP_SCHEMA: "true"
    volumes:
      - ./platform/db/migrations:/migrations:ro
    command: ["--wait", "--no-dump-schema", "--migrations-dir", "/migrations", "up"]
    healthcheck:
      test: ["CMD", "dbmate", "--help"]
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 2s

  n8n-main:
    image: n8nio/n8n:2.37.9
    container_name: n8n-main
    restart: unless-stopped
    environment:
      <<: *n8n-environment
    ports:
      - "127.0.0.1:5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      <<: *n8n-depends
    healthcheck:
      <<: *n8n-healthcheck

  n8n-worker-1:
    image: n8nio/n8n:2.37.9
    container_name: n8n-worker-1
    restart: unless-stopped
    command: worker
    environment:
      <<: *n8n-environment
    depends_on:
      <<: *n8n-depends
    healthcheck:
      <<: *n8n-healthcheck

  n8n-worker-2:
    image: n8nio/n8n:2.37.9
    container_name: n8n-worker-2
    restart: unless-stopped
    command: worker
    environment:
      <<: *n8n-environment
    depends_on:
      <<: *n8n-depends
    healthcheck:
      <<: *n8n-healthcheck

  mailpit:
    image: axllent/mailpit:v1.31.1
    container_name: n8n-mailpit
    restart: unless-stopped
    environment:
      TZ: Europe/Helsinki
      MP_MAX_MESSAGES: "5000"
      MP_DATABASE: /data/mailpit.db
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    volumes:
      - mailpit_data:/data
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  mock-llm:
    build:
      context: platform/services/mock-llm
      dockerfile: Dockerfile
    container_name: n8n-mock-llm
    restart: unless-stopped
    environment:
      TZ: Europe/Helsinki
    ports:
      - "127.0.0.1:8090:8090"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health')\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  flaky-api:
    build:
      context: platform/services/flaky-api
      dockerfile: Dockerfile
    container_name: n8n-flaky-api
    restart: unless-stopped
    environment:
      TZ: Europe/Helsinki
    ports:
      - "127.0.0.1:8091:8091"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:8091/health >/dev/null 2>&1 || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  review-ui:
    build:
      context: platform/services/review-ui
      dockerfile: Dockerfile
    container_name: n8n-review-ui
    restart: unless-stopped
    environment:
      TZ: Europe/Helsinki
    ports:
      - "127.0.0.1:8092:8092"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8092/health')\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  postgres_data:
  redis_data:
  n8n_data:
  mailpit_data:
